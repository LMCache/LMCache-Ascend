[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[toml]>=6.2",
    "torch",
    "torch-npu",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-ascend"
authors = [
    { name = "LMCache Team", email = "lmcacheteam@gmail.com" },
    { name = "GingFung Matthew Yeung", email = "gingfung.matthew.yeung@huawei.com" },
    { name = "Junyuan Jing", email = "jjysama@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
description = "LMCache on Ascend NPU"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://docs.lmcache.ai"
source = "https://github.com/LMCache/LMCache-Ascend"
issues = "https://github.com/LMCache/LMCache-Ascend"

[tool.setuptools_scm]
version_file = "lmcache_ascend/_version.py"
# do not include +gREV local version, required for Test PyPI upload
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = [""]
include = ["lmcache_ascend", "lmcache_ascend*"]

[tool.ruff]
# same as Black's default line length
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    #"SIM",
    # Ruff does not support isort's import_headings feature, yet.
    # "I",
    # flake8-logging-format: f-string in a logging call. %-format defers the
    # formatting until the record is actually emitted. Only G004 is enabled;
    # G201/G002 change the logged content rather than the evaluation cost.
    "G004",
    # flake8-self (private member access)
    "SLF",
    # pylint: logging call has more arguments than format placeholders
    "PLE1205",
    # flake8-tidy-imports: banned API imports
    "TID251",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
# Ignore SLF everywhere except lmcache_ascend/v1/multiprocess/, matching
# upstream LMCache's policy. The rest of the repo accesses private members of
# upstream LMCache/vLLM objects that expose no public equivalent, and tests
# assert on internals by design.
"!lmcache_ascend/v1/multiprocess/**" = ["SLF"]

[tool.ruff.lint.isort]
# same as .isort.cfg
from-first = true
# not supported yet
# import-heading-future=Future
# import-heading-stdlib=Standard
# import-heading-thirdparty=Third Party
# import-heading-firstparty=First Party
# import-heading-localfolder=Local

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Use a data-only serialization format instead."

[tool.codespell]
# cann: Ascend CANN; enque: AscendC EnQue/DeQue queue API
ignore-words-list = "cann,enque"

[tool.mypy]
modules = ["lmcache_ascend", "tests"]

disable_error_code = []

ignore_missing_imports = true
explicit_package_bases = true

# TODO: tighten MyPy checks by enabling these checks over time.
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

follow_imports = "silent"

# In-process mode is maintained on the dsv4_support_045 branch; main only
# maintains MP mode. Keep the legacy in-process modules out of mypy tightening
# so this config only gates the MP surface (ops.py, shape_desc.py,
# logical_block_size.py, and their tests).
[[tool.mypy.overrides]]
module = [
    "lmcache_ascend.integration.patch.*",
    "lmcache_ascend.integration.sglang.*",
    "lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1",
    "lmcache_ascend.integration.vllm.vllm_v1_adapter",
    "lmcache_ascend.integration.vllm.vllm_v1_adapter_hole",
    "lmcache_ascend.serde.*",
    "lmcache_ascend.utils",
    "lmcache_ascend.v1.blend.*",
    "lmcache_ascend.v1.cache_controller.*",
    "lmcache_ascend.v1.cache_engine",
    "lmcache_ascend.v1.hole_segment_utils",
    "lmcache_ascend.v1.internal_api_server.*",
    "lmcache_ascend.v1.kv_format",
    "lmcache_ascend.v1.kv_layer_groups",
    "lmcache_ascend.v1.lookup_client.*",
    "lmcache_ascend.v1.memory_management",
    "lmcache_ascend.v1.npu_connector.*",
    "lmcache_ascend.v1.npu_hole_connector",
    "lmcache_ascend.v1.proxy_memory_obj",
    "lmcache_ascend.v1.storage_backend.*",
    "lmcache_ascend.v1.system_detection",
    "lmcache_ascend.v1.token_database",
    "lmcache_ascend.v1.trace_utils_compat",
    "lmcache_ascend.v1.transfer_channel.*",
    "lmcache_ascend.v1.transfer_context",
    "benchmark.*",
    "tests.integration.*",
    "tests.v1.storage_backend.*",
    "tests.v1.test_cachegen_kernels",
    "tests.v1.test_pos_kernels",
    "tests.v1.transfer_channel.*",
]
ignore_errors = true
