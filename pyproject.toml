[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[toml]>=6.2",
    "torch",
    "torch-npu",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-ascend"
authors = [
    { name = "LMCache Team", email = "lmcacheteam@gmail.com" },
    { name = "GingFung Matthew Yeung", email = "gingfung.matthew.yeung@huawei.com" },
    { name = "Junyuan Jing", email = "jjysama@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
description = "LMCache on Ascend NPU"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://docs.lmcache.ai"
source = "https://github.com/LMCache/LMCache-Ascend"
issues = "https://github.com/LMCache/LMCache-Ascend"

[tool.setuptools_scm]
version_file = "lmcache_ascend/_version.py"
# do not include +gREV local version, required for Test PyPI upload
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = [""]
include = ["lmcache_ascend", "lmcache_ascend*"]

[tool.ruff]
# same as Black's default line length
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    #"SIM",
    # Ruff does not support isort's import_headings feature, yet.
    # "I",
    # flake8-logging-format: f-string in a logging call. %-format defers the
    # formatting until the record is actually emitted. Only G004 is enabled;
    # G201/G002 change the logged content rather than the evaluation cost.
    "G004",
    # flake8-self (private member access)
    "SLF",
    # pylint: logging call has more arguments than format placeholders
    "PLE1205",
    # flake8-tidy-imports: banned API imports
    "TID251",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
# Ignore SLF everywhere except lmcache_ascend/v1/multiprocess/
"!lmcache_ascend/v1/multiprocess/**" = ["SLF"]
# G004: files that have not been migrated to lazy %-format logging yet. Drop an
# entry once its file is converted so the rule protects it from regressing.
"lmcache_ascend/integration/patch/apply_patch.py" = ["G004"]
"lmcache_ascend/integration/patch/base_patcher.py" = ["G004"]
"lmcache_ascend/integration/sglang/sglang_adapter.py" = ["G004"]
"lmcache_ascend/v1/blend/blender.py" = ["G004"]
"lmcache_ascend/v1/blend/models/utils.py" = ["G004"]
"lmcache_ascend/v1/blend/positional_encoding.py" = ["G004"]
"lmcache_ascend/v1/blend/utils.py" = ["G004"]
"lmcache_ascend/v1/cache_engine.py" = ["G004"]
"lmcache_ascend/v1/kv_format.py" = ["G004"]
"lmcache_ascend/v1/npu_connector/npu_connectors.py" = ["G004"]
"lmcache_ascend/v1/storage_backend/__init__.py" = ["G004"]
"lmcache_ascend/v1/storage_backend/p2p_backend.py" = ["G004"]
"lmcache_ascend/v1/storage_backend/storage_manager.py" = ["G004"]
"lmcache_ascend/v1/system_detection.py" = ["G004"]
"lmcache_ascend/v1/token_database.py" = ["G004"]
"lmcache_ascend/v1/transfer_channel/hccl_channel.py" = ["G004", "TID251"]
"tests/v1/transfer_channel/test_hccl_channel_write.py" = ["G004"]
"tests/v1/transfer_channel/test_hixl_channel_write.py" = ["G004"]
"benchmark/cacheblend/benchmark-hole.py" = ["G004"]
"benchmark/v1/rag/rag.py" = ["G004"]
"benchmark/v1/rag/utils.py" = ["G004"]
"setup.py" = ["G004"]

[tool.ruff.lint.isort]
# same as .isort.cfg
from-first = true
# not supported yet
# import-heading-future=Future
# import-heading-stdlib=Standard
# import-heading-thirdparty=Third Party
# import-heading-firstparty=First Party
# import-heading-localfolder=Local

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Use a data-only serialization format instead."

[tool.codespell]
# cann: Ascend CANN; enque: AscendC EnQue/DeQue queue API
ignore-words-list = "cann,enque"

[tool.mypy]
modules = ["lmcache_ascend", "tests"]

# TODO: tighten MyPy checks by enabling these checks over time.
disable_error_code = [
    "annotation-unchecked",
    "union-attr",
    "var-annotated",
    "arg-type",
    "call-arg",
    "import-untyped",
    "attr-defined",
    "return-value",
    "assignment",
    "call-overload",
    "misc",
]

ignore_missing_imports = true
explicit_package_bases = true

# TODO: tighten MyPy checks by enabling these checks over time.
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

follow_imports = "silent"
