chunk_size: 256
local_cpu: True
max_local_cpu_size: 5
enable_async_loading: True

# P2P configurations
enable_p2p: True
p2p_host: "localhost" # replace with the host ip
p2p_init_ports: [9960, 9961] # per TP instance
p2p_lookup_ports: [9962, 9963] # per TP instance
transfer_channel: "hccl"
p2p_use_npu: True
p2p_pull_mode: True
p2p_delay_pull: True
# 128MB
p2p_npu_buffer_size: 134217728

# Controller configurations
enable_controller: True
lmcache_instance_id: "lmcache_instance_1"
controller_pull_url: "localhost:9800" # replace with the controller pull url
controller_reply_url: "localhost:9900" # replace with the controller reply url
lmcache_worker_ports: [9950, 9951] # per TP instance

extra_config:
  lookup_backoff_time: 0.001
  # Optional for HCCL P2P pull mode. When enabled, HCCL registers a bounded
  # CPU staging arena instead of the full CPU KV cache. The producer copies hit
  # chunks into this arena, returns staging refs to the receiver, then releases
  # them after the receiver sends Done or the pull lease expires. This avoids
  # HCCL registration OOMs when the local CPU cache is large.
  use_host_staging: False
  # Only used when use_host_staging is True; caps in-flight staged KV bytes.
  os_staging_bytes: 8589934592 # 8GB
