version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must run the same codeql-action version, otherwise
      # CodeQL rejects the workflow.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # torch / torch_npu are pinned by the vllm-ascend container image.
      - dependency-name: "torch"
      - dependency-name: "torch-npu"
    groups:
      minor-update:
        applies-to: version-updates
        update-types: ["minor"]
