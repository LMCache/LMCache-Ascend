name: Code Quality

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: ['main', '*-dev']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  statuses: write

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            atomgit.com:443
            api.github.com:443
            gitcode.com:443

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # for setuptools-scm
          fetch-depth: 0
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: echo "::add-matcher::.github/workflows/matchers/mypy.json"

      - name: Run code quality checks - lint, format, spell, & static checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files
      
      - name: 🟡 Set Hardware Test to Pending
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            
            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'pending',
                description: 'Queued (Waiting for runner pick-up)...',
                context: '910B Unit Tests Status'
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'pending',
                description: 'Queued (Waiting for runner pick-up)...',
                context: '910C Unit Tests Status'
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'pending',
                description: 'Queued (Waiting for runner pick-up)...',
                context: '910C Perf & Accuracy Status'
              });
            } catch (error) {
              // 403 means "Forbidden" (likely a Fork PR). We ignore it.
              if (error.status === 403) {
                console.log('⚠️ Could not set status (likely a Fork PR with read-only token). Skipping.');
                return; // Exit gracefully
              }
              // If it's another error, throw it so we know
              throw error;
            }
